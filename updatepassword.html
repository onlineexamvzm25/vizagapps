<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOREOFGAMES - Change Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    .container { width: min(340px, calc(100% - 32px)); margin: 50px auto; }
    input, button { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 10px; }
    #msg { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h3>Change Password</h3>
    <p id="accountPhone"></p>
    <input type="password" id="currentPassword" placeholder="Current password" autocomplete="current-password" required>
    <input type="password" id="newPassword" placeholder="New password (minimum 6 characters)" autocomplete="new-password" minlength="6" required>
    <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="6" required>
    <button id="updateButton" type="button">Update Password</button>
    <button type="button" onclick="window.location.href='homepage.html'">Back to Home</button>
    <div id="msg" role="status"></div>
  </div>

  <script>
    let currentUser = null;
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await STORE_AUTH.requireSession();
      if (!session) return;
      currentUser = session.user;
      const savedPhone = (currentUser.user_metadata && currentUser.user_metadata.phone)
        || localStorage.getItem('store_phone') || '';
      document.getElementById('accountPhone').textContent = 'Account: ' + savedPhone;
      document.getElementById('updateButton').addEventListener('click', updatePassword);
    });

    async function updatePassword() {
      const msg = document.getElementById('msg');
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const button = document.getElementById('updateButton');
      msg.style.color = 'red';
      msg.textContent = '';

      if (!currentUser || !currentUser.phone) {
        msg.textContent = 'Please sign in again.';
        return;
      }
      if (!currentPassword || !newPassword || !confirmPassword) {
        msg.textContent = 'Please complete all fields.';
        return;
      }
      if (newPassword.length < 6) {
        msg.textContent = 'New password must contain at least 6 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        msg.textContent = 'New password and confirmation do not match.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';
      try {
        // Verify the current password before changing it.
        const savedPhone = (currentUser.user_metadata && currentUser.user_metadata.phone)
          || localStorage.getItem('store_phone');
        const { error: verifyError } = await STORE_AUTH.client.auth.signInWithPassword({
          email: STORE_AUTH.loginIdentifier(savedPhone),
          password: currentPassword
        });
        if (verifyError) throw new Error('Current password is incorrect.');

        await STORE_AUTH.updatePassword(newPassword);
        msg.style.color = 'green';
        msg.textContent = 'Password updated successfully.';
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      } catch (error) {
        msg.textContent = error.message || 'Unable to update password.';
      } finally {
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
