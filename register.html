<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOREOFGAMES - Registration</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#f0f2f5;
      display:flex; justify-content:center; align-items:center; min-height:100vh;
      margin:0; padding:16px; }
    .panel { background:#fff; padding:2rem; border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,.1); width:100%; max-width:360px; }
    h2,p { text-align:center; }
    .hint { color:#666; font-size:14px; margin-bottom:20px; }
    input { width:100%; padding:12px; margin:7px 0; border:1px solid #ccc;
      border-radius:5px; font-size:16px; }
    button { width:100%; padding:12px; margin-top:12px; background:#4CAF50;
      color:#fff; border:0; border-radius:5px; cursor:pointer; font-size:16px; }
    button:disabled { opacity:.65; cursor:wait; }
    #message { font-size:14px; }
    a { color:#1769aa; }
  </style>
</head>
<body>
  <main class="panel">
    <h2>STOREOFGAMES</h2>
    <p class="hint">Create your password to activate your store account.</p>
    <form id="register-form">
      <input id="phone" type="tel" placeholder="Registered phone number"
        autocomplete="tel" inputmode="numeric" required>
      <input id="password" type="password" placeholder="Create password"
        autocomplete="new-password" minlength="8" required>
      <input id="confirm-password" type="password" placeholder="Confirm password"
        autocomplete="new-password" minlength="8" required>
      <button id="register-button" type="submit">Register</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p>Already registered? <a href="index.html">Login</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const message = document.getElementById('message');
    const button = document.getElementById('register-button');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.style.color = '#b00020';
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (password.length < 8) {
        message.textContent = 'Password must contain at least 8 characters.';
        return;
      }
      if (password !== confirm) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      button.disabled = true;
      button.textContent = 'Registering...';
      try {
        const { data, error } = await STORE_AUTH.client.functions.invoke(
          'register-store-user', { body: { phone, password } }
        );
        if (error) {
          let detail = error.message || 'Registration failed.';
          try {
            const response = await error.context.json();
            if (response && response.error) detail = response.error;
          } catch (_) {}
          throw new Error(detail);
        }
        if (!data || !data.success) throw new Error(data?.error || 'Registration failed.');
        message.style.color = 'green';
        message.textContent = 'Registration successful! You can now log in.';
        form.reset();
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } catch (err) {
        console.error('Registration failed:', err);
        message.textContent = err.message || 'Registration failed. Please try again.';
      } finally {
        button.disabled = false;
        button.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
