    // Utility: Create a radio button group
  function createRadioGroup(name, labels, values) {
  const container = document.createElement('div');
  container.className = 'horizontal-form';
  labels.forEach((lbl, idx) => {
    const id = `${name}-${values[idx]}`;
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.id = id;
    radio.name = name;
    radio.value = values[idx];
    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = lbl;
    container.append(radio, label);
  });
  return container;
}


  function renderTable(rows) {
  resultsDiv.innerHTML = '';
  const pdfButton = document.getElementById('pdfButtonContainer');

  if (!rows.length) {
    resultsDiv.textContent = 'No records found for this selection.';
    pdfButton.style.display = 'none';
    return;
  }

  pdfButton.style.display = 'block';

  const table = document.createElement('table');
  table.id = 'dataTable'; // 🆕 ID for PDF export
  const header = table.createTHead().insertRow();
  Object.keys(rows[0]).forEach((col) => {
    const th = document.createElement('th');
    th.textContent = col;
    header.appendChild(th);
  });

  const tbody = table.createTBody();
  rows.forEach((row) => {
    const tr = tbody.insertRow();
    Object.values(row).forEach((val) => {
      const td = tr.insertCell();
      td.textContent = val;
    });
  });

  resultsDiv.appendChild(table);
}

  async function handleDateReport() {
  controlsDiv.innerHTML = '';

  // Report Type Combo Box

  const cb = document.createElement('select');

    opt.textContent = o;

  const dynamicWrapper = document.createElement('div');
  dynamicWrapper.className = 'horizontal-form';
  controlsDiv.appendChild(dynamicWrapper);

  cb.addEventListener('change', () => {
  dynamicWrapper.innerHTML = '';

    // Fetch data for Date Reports
    async function fetchDateData({ singleDate, range, month, entire, type }) {
      const tableName = TABLES.solditemsfromstore;
      const tableName1 = TABLES.addeditemstostore;
      const table = type === '1' ?  tableName1 : tableName;
      let query = supabase.from(table).select('*');

      if (singleDate) {
        query = query.eq(type === '1' ? 'addeddate' : 'solddate', singleDate);
      } else if (range === 'last7') {
        const fromDate = new Date();
        fromDate.setDate(fromDate.getDate() - 6);
        query = query.gte(type === '1' ? 'addeddate' : 'solddate', fromDate.toISOString().split('T')[0]);
      } else if (month) {
         const year = new Date().getFullYear();

  // Get the start of the current month
          const startDate = `${year}-${String(month).padStart(2, '0')}-01`;

  // Calculate next month's date safely
          const nextMonthDate = new Date(year, month, 1); // month is 1-based in your code
          const nextMonthYear = nextMonthDate.getFullYear();
          const nextMonth = nextMonthDate.getMonth() + 1; // getMonth() gives 0-based month

          const endDate = `${nextMonthYear}-${String(nextMonth).padStart(2, '0')}-01`;

          query = query
          .gte(type === '1' ? 'addeddate' : 'solddate', startDate)
          .lt(type === '1' ? 'addeddate' : 'solddate', endDate);  
      
      }
      const { data, error } = await query.order('itemname', { ascending: true });
      if (error) {
        resultsDiv.textContent = 'Error: ' + error.message;
      } else {
        renderTable(data);
      }
    }

    // Fetch data for Sale Analysis
    async function fetchSaleAnalysis({ singleDate, range, month }) {
      const tableName = TABLES.solditemsfromstore;
      let query = supabase.from(tableName).select('itemname, soldquantity');
      if (singleDate) {
        query = query.eq('solddate', singleDate);
      } else if (range === 'last7') {
        const fromDate = new Date();
        fromDate.setDate(fromDate.getDate() - 6);
        query = query.gte('solddate', fromDate.toISOString().split('T')[0]);
      } else if (month) {
         const year = new Date().getFullYear();

  // Get the start of the current month
          const startDate = `${year}-${String(month).padStart(2, '0')}-01`;

  // Calculate next month's date safely
          const nextMonthDate = new Date(year, month, 1); // month is 1-based in your code
          const nextMonthYear = nextMonthDate.getFullYear();
          const nextMonth = nextMonthDate.getMonth() + 1; // getMonth() gives 0-based month

          const endDate = `${nextMonthYear}-${String(nextMonth).padStart(2, '0')}-01`;

          query = query
          .gte(type === '1' ? 'addeddate' : 'solddate', startDate)
          .lt(type === '1' ? 'addeddate' : 'solddate', endDate);  
      }

      const { data, error } = await query;
      if (error) {
        resultsDiv.textContent = 'Error: ' + error.message;
        return;
      }

      const totals = data.reduce((acc, row) => {
        acc[row.itemname] = (acc[row.itemname] || 0) + row.soldquantity;
        return acc;
      }, {});

      const rows = Object.entries(totals)
        .sort((a, b) => b[1] - a[1])
        .map(([itemname, soldquantity]) => ({ itemname, soldquantity }));

      renderTable(rows);
    }

    async function fetchBillWiseData({ period, singleDate, month, search, phoneSearch }) {
      resultsDiv.innerHTML = 'Loading bill-wise report...';
      document.getElementById('pdfButtonContainer').style.display = 'none';

      let query = supabase
        .from('store_sales_bills')
        .select('bill_id, bill_number, bill_date, bill_time, customer_name, customer_phone, sold_by, total_amount, status')
        .order('bill_date', { ascending: false })
        .order('bill_time', { ascending: false });

      if (period === 'single') {
        if (!singleDate) {
          resultsDiv.textContent = 'Please select a date.';
          return;
        }
        query = query.eq('bill_date', singleDate);
      } else if (period === 'last7') {
        const fromDate = new Date();
        fromDate.setDate(fromDate.getDate() - 6);
        const dateText = [
          fromDate.getFullYear(),
          String(fromDate.getMonth() + 1).padStart(2, '0'),
          String(fromDate.getDate()).padStart(2, '0')
        ].join('-');
        query = query.gte('bill_date', dateText);
      } else if (period === 'month') {
        const year = new Date().getFullYear();
        const startDate = `${year}-${month}-01`;
        const nextMonthDate = new Date(year, Number(month), 1);
        const endDate = [
          nextMonthDate.getFullYear(),
          String(nextMonthDate.getMonth() + 1).padStart(2, '0'),
          '01'
        ].join('-');
        query = query.gte('bill_date', startDate).lt('bill_date', endDate);
      }

      const { data: bills, error: billError } = await query;
      if (billError) {
        resultsDiv.textContent = 'Error loading bills: ' + billError.message;
        return;
      }

      if (!bills || bills.length === 0) {
        resultsDiv.textContent = 'No bills found for this selection.';
        return;
      }

      const billIds = bills.map(bill => bill.bill_id);
      const { data: lines, error: lineError } = await supabase
        .from(TABLES.solditemsfromstore)
        .select('bill_id, itemid, itemname, soldquantity, unit_price, soldprice, unit')
        .in('bill_id', billIds)
        .order('itemname', { ascending: true });

      if (lineError) {
        resultsDiv.textContent = 'Error loading bill items: ' + lineError.message;
        return;
      }

      const linesByBill = new Map();
      (lines || []).forEach(line => {
        if (!linesByBill.has(line.bill_id)) linesByBill.set(line.bill_id, []);
        linesByBill.get(line.bill_id).push(line);
      });

      const normalizedSearch = (search || '').toLowerCase();
      // Compare digits only so phone searches also work if a stored number
      // contains spaces, +91, hyphens or other formatting characters.
      const normalizedPhoneSearch = String(phoneSearch || '').replace(/\D/g, '');
      const visibleBills = bills.filter(bill => {
        const matchesGeneralSearch = !normalizedSearch || [
          bill.bill_number, bill.customer_name, bill.sold_by
        ].some(value => String(value || '').toLowerCase().includes(normalizedSearch));
        const storedPhone = String(bill.customer_phone || '').replace(/\D/g, '');
        const matchesPhone = !normalizedPhoneSearch || storedPhone.includes(normalizedPhoneSearch);
        return matchesGeneralSearch && matchesPhone;
      });

      if (visibleBills.length === 0) {
        resultsDiv.textContent = 'No bills match your search.';
        return;
      }

      const totalAmount = visibleBills.reduce((sum, bill) => sum + Number(bill.total_amount || 0), 0);
      const summary = document.createElement('p');
      summary.className = 'bill-report-summary';
      summary.textContent = `Bills: ${visibleBills.length} | Total Sales: ₹${totalAmount.toFixed(2)}`;
      resultsDiv.appendChild(summary);

      const table = document.createElement('table');
      table.id = 'dataTable';
      const headers = [
        'Bill Number', 'Date', 'Time', 'Customer', 'Phone', 'Sold By',
        'Item ID', 'Item Name', 'Quantity', 'Unit', 'Unit Price',
        'Line Amount', 'Bill Total', 'Status'
      ];
      const thead = table.createTHead();
      const headerRow = thead.insertRow();
      headers.forEach(label => {
        const th = document.createElement('th');
        th.textContent = label;
        headerRow.appendChild(th);
      });

      const tbody = table.createTBody();
      visibleBills.forEach(bill => {
        const billLines = linesByBill.get(bill.bill_id) || [];
        if (billLines.length === 0) {
          const row = tbody.insertRow();
          [
            bill.bill_number, bill.bill_date, bill.bill_time, bill.customer_name || '',
            bill.customer_phone || '', bill.sold_by, '', 'No item rows found',
            '', '', '', '', Number(bill.total_amount || 0).toFixed(2), bill.status
          ].forEach(value => {
            const cell = row.insertCell();
            cell.textContent = value == null ? '' : String(value);
          });
          return;
        }

        billLines.forEach((line, index) => {
          const row = tbody.insertRow();
          const values = [
            index === 0 ? bill.bill_number : '',
            index === 0 ? bill.bill_date : '',
            index === 0 ? bill.bill_time : '',
            index === 0 ? (bill.customer_name || '') : '',
            index === 0 ? (bill.customer_phone || '') : '',
            index === 0 ? bill.sold_by : '',
            line.itemid,
            line.itemname,
            line.soldquantity,
            line.unit || '',
            line.unit_price == null ? '' : Number(line.unit_price).toFixed(2),
            line.soldprice == null ? '' : Number(line.soldprice).toFixed(2),
            index === 0 ? Number(bill.total_amount || 0).toFixed(2) : '',
            index === 0 ? bill.status : ''
          ];
          values.forEach(value => {
            const cell = row.insertCell();
            cell.textContent = value == null ? '' : String(value);
          });
        });
      });

      resultsDiv.appendChild(table);
      document.getElementById('pdfButtonContainer').style.display = 'block';
    }

    // Attach event listeners
    document.getElementById('btnDate').onclick = handleDateReport;
    document.getElementById('btnItem').onclick = handleItemReport;
    document.getElementById('btnSaleAnalysis').onclick = handleSaleAnalysis;
    document.getElementById('btnNotSold').onclick = handleNotSold;
    document.getElementById('btnBillWise').onclick = handleBillWiseReports;
    document.getElementById('homeBtn').onclick = () => {
      window.location.href = 'AdminReports.html';
    };


  if (new URLSearchParams(window.location.search).get('report') === 'bills') {
    handleBillWiseReports();
  }

  document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
  const tableElement = document.getElementById('dataTable');
  if (!tableElement) return;

  const canvas = await html2canvas(tableElement);
  const imgData = canvas.toDataURL('image/png');

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');

  const imgProps = pdf.getImageProperties(imgData);
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

  pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
  pdf.save('report.pdf');
});
