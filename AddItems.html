  <script>
    let storeConfigItems = [];
    let selectedStockProduct = null;
    let barcodeScanner = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const db = window.storeSupabase || window.supabase;
      const timeDisplay = document.getElementById('timeDisplay');

      const now = new Date();
      timeDisplay.textContent =
        `🕒 ${now.toLocaleDateString()} ${now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        })}`;

      if (!db) {
        alert('Supabase client is not available. Please refresh the page.');
        return;
      }

      const { data, error } = await db
        .from(TABLES.storeconfigitems)
        .select('itemid, barcode, itemname, itemcost, unit, itemtype, is_active')
        .eq('is_active', true)
        .order('itemname', { ascending: true });

      if (error) {
        alert('Failed to fetch active products: ' + error.message);
        return;
      }

      storeConfigItems = data || [];

      document.getElementById('productSearch')
        .addEventListener('input', searchStockProducts);

      document.getElementById('scanBarcodeButton')
        .addEventListener('click', startBarcodeScanner);

      document.getElementById('stopScannerButton')
        .addEventListener('click', stopBarcodeScanner);

      document.getElementById('quantityInput')
        .addEventListener('input', calculateStockTotal);

      document.getElementById('aprice')
        .addEventListener('input', calculateStockTotal);
    });

    function escapeStockHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    // Search active products by Item ID, product name or barcode.
    // USB barcode scanners work by typing into the search field.
    function searchStockProducts() {
      const search = document.getElementById('productSearch')
        .value.trim().toLowerCase();

      const results = document.getElementById('productSearchResults');

      selectedStockProduct = null;
      document.getElementById('itemSelect').value = '';
      document.getElementById('selectedProduct').style.display = 'none';
      document.getElementById('productUnitLabel').textContent = 'unit';

      if (!search) {
        results.innerHTML = '';
        calculateStockTotal();
        return;
      }

      const matches = storeConfigItems.filter(product =>
        String(product.itemid).includes(search) ||
        String(product.itemname || '').toLowerCase().includes(search) ||
        String(product.barcode || '').toLowerCase().includes(search)
      ).slice(0, 20);

      if (matches.length === 0) {
        results.innerHTML =
          '<p style="padding:10px;">No active products found.</p>';
        return;
      }

      results.innerHTML = matches.map(product => `
        <div
          role="button"
          tabindex="0"
          onclick="selectStockProduct(${Number(product.itemid)})"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectStockProduct(${Number(product.itemid)});}"
          style="padding:11px; border-bottom:1px solid #eee; cursor:pointer;">
          <strong>${escapeStockHtml(product.itemname)}</strong><br>
          <small>
            ID: ${escapeStockHtml(product.itemid)}
            &nbsp; | &nbsp;
            Barcode: ${escapeStockHtml(product.barcode || '—')}
            &nbsp; | &nbsp;
            Unit: ${escapeStockHtml(product.unit || 'pcs')}
          </small>
        </div>
      `).join('');
    }

    function selectStockProduct(itemId) {
      const product = storeConfigItems.find(
        item => Number(item.itemid) === Number(itemId)
      );

      if (!product) return;

      selectedStockProduct = product;

      document.getElementById('itemSelect').value = product.itemid;
      document.getElementById('productSearch').value = product.itemname;
      document.getElementById('productSearchResults').innerHTML = '';

      document.getElementById('selectedProduct').style.display = 'block';
      document.getElementById('selectedProductDetails').innerHTML = `
        Product: <strong>${escapeStockHtml(product.itemname)}</strong><br>
        Item ID: ${escapeStockHtml(product.itemid)}<br>
        Barcode: ${escapeStockHtml(product.barcode || '—')}<br>
        Unit: ${escapeStockHtml(product.unit || 'pcs')}
      `;

      document.getElementById('productUnitLabel').textContent =
        product.unit || 'pcs';

      document.getElementById('aprice').value = product.itemcost || 1;

      calculateStockTotal();
    }

    async function startBarcodeScanner() {
      if (!window.Html5Qrcode) {
        alert('Barcode scanner library is not available. Please refresh the page.');
        return;
      }

      document.getElementById('scannerArea').style.display = 'block';

      try {
        barcodeScanner = new Html5Qrcode('barcodeReader');

        await barcodeScanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 120 }
          },
          async decodedText => {
            const scannedBarcode = decodedText.trim();

            document.getElementById('productSearch').value = scannedBarcode;

            const exactMatch = storeConfigItems.find(product =>
              String(product.barcode || '').trim().toLowerCase() ===
              scannedBarcode.toLowerCase()
            );

            if (exactMatch) {
              selectStockProduct(exactMatch.itemid);
              await stopBarcodeScanner();
            } else {
              searchStockProducts();
              alert('No active product found for barcode: ' + scannedBarcode);
            }
          },
          () => {}
        );
      } catch (error) {
        console.error('Camera scanner error:', error);
        alert('Unable to start camera. Please allow camera permission and use HTTPS.');
        document.getElementById('scannerArea').style.display = 'none';
        barcodeScanner = null;
      }
    }

    async function stopBarcodeScanner() {
      if (barcodeScanner) {
        try {
          await barcodeScanner.stop();
          await barcodeScanner.clear();
        } catch (error) {
          console.warn('Scanner stop:', error);
        }
        barcodeScanner = null;
      }

      document.getElementById('scannerArea').style.display = 'none';
    }

    function calculateStockTotal() {
      const quantity = Number(document.getElementById('quantityInput').value);
      const unitPrice = Number(document.getElementById('aprice').value);

      const total = Number.isFinite(quantity) && quantity > 0 &&
        Number.isFinite(unitPrice) && unitPrice >= 0
          ? quantity * unitPrice
          : 0;

      document.getElementById('stockTotal').textContent = total.toFixed(2);
    }

    let stockSuccessTimer = null;

    function showStockSuccess(message) {
      const toast = document.getElementById('stockSuccessMessage');
      toast.textContent = message;
      toast.classList.add('show');
      if (stockSuccessTimer) clearTimeout(stockSuccessTimer);
      stockSuccessTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    function resetStockEntryFields() {
      selectedStockProduct = null;
      document.getElementById('productSearch').value = '';
      document.getElementById('productSearchResults').innerHTML = '';
      document.getElementById('itemSelect').value = '';
      document.getElementById('selectedProduct').style.display = 'none';
      document.getElementById('selectedProductDetails').innerHTML = '';
      document.getElementById('productUnitLabel').textContent = 'unit';
      document.getElementById('quantityInput').value = '';
      document.getElementById('aprice').value = '';
      document.getElementById('aremarks').value = 'none';
      calculateStockTotal();
      document.getElementById('productSearch').focus();
    }

    // Stock-in uses the atomic database RPC. Do not call the legacy
    // addItemstoStoreDaily() helper from this page.
    async function addItemToStore() {
      const quantityInput = document.getElementById('quantityInput');
      const quantityText = quantityInput.value.trim();
      const quantity = Number(quantityText);
      const selectedItem = selectedStockProduct?.itemid;
      const unitPriceText = document.getElementById('aprice').value.trim();
      const unitPrice = Number(unitPriceText);
      const remarksText = document.getElementById('aremarks').value.trim();
      const remarks = remarksText && remarksText.toLowerCase() !== 'none'
        ? remarksText
        : null;

      if (!selectedItem || !selectedStockProduct) {
        alert('Please search and select a product first.');
        document.getElementById('productSearch').focus();
        return;
      }

      if (!quantityText || !Number.isFinite(quantity) || quantity <= 0) {
        alert('Please enter a valid quantity greater than zero.');
        quantityInput.focus();
        return;
      }

      if (Math.round(quantity * 1000) !== quantity * 1000) {
        alert('Quantity can have a maximum of 3 decimal places.');
        quantityInput.focus();
        return;
      }

      if (!unitPriceText || !Number.isFinite(unitPrice) || unitPrice < 0) {
        alert('Please enter a valid purchase price per unit (zero or greater).');
        document.getElementById('aprice').focus();
        return;
      }

      if (Math.round(unitPrice * 100) !== unitPrice * 100) {
        alert('Purchase price can have a maximum of 2 decimal places.');
        document.getElementById('aprice').focus();
        return;
      }

      const db = window.storeSupabase || window.supabase;
      if (!db || typeof db.rpc !== 'function') {
        alert('Supabase client is not available. Please refresh the page.');
        return;
      }

      const submitButton = document.getElementById('addStockButton');
      submitButton.disabled = true;
      submitButton.textContent = 'Processing...';

      try {
        const { data, error } = await db.rpc('store_add_stock', {
          p_item_id: Number(selectedItem),
          p_quantity: quantity,
          p_unit_price: unitPrice,
          p_remarks: remarks
        });

        if (error) {
          throw new Error(error.message || 'Stock-in failed.');
        }

        if (!data || data.success !== true) {
          throw new Error(data?.message || 'The database did not confirm the stock-in.');
        }

        const total = Number(data.total_amount);
        const stockAfter = Number(data.stock_after);

        const productName = data.item_name || selectedStockProduct.itemname;
        const productUnit = selectedStockProduct.unit || 'pcs';
        const addedQuantity = Number(data.quantity_added).toFixed(3);

        resetStockEntryFields();
        showStockSuccess(
          '✓ Stock added successfully! ' + productName + ' — ' +
          addedQuantity + ' ' + productUnit + ' added. Total: ₹' +
          total.toFixed(2) + '. Available stock: ' +
          stockAfter.toFixed(3) + ' ' + productUnit + '.'
        );
      } catch (error) {
        console.error('Atomic stock-in RPC error:', error);
        alert('Unable to add stock: ' + error.message);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Add Item to Store';
      }
    }
  </script>

</script>

<body>
  <div class="container">
    <h2>ADD ITEMS TO STORE</h2>

    <div class="timestamp" id="timeDisplay">🕒</div>

    <label for="productSearch">Search Product (ID / Name / Barcode):</label>

    <input
      type="text"
      id="productSearch"
      placeholder="Enter Item ID, Product Name or Scan Barcode"
      autocomplete="off">

    <button type="button" id="scanBarcodeButton">
      Scan Barcode Using Camera
    </button>

    <div id="scannerArea" style="display:none; margin:15px 0;">
      <div id="barcodeReader" style="width:100%;"></div>
      <button type="button" id="stopScannerButton">
        Stop Camera
      </button>
    </div>

    <div id="productSearchResults"
        style="border:1px solid #ddd; border-radius:5px; margin-bottom:20px;">
    </div>

    <div id="selectedProduct"
        style="display:none; padding:12px; background:#eef7ff;
                border-radius:6px; margin-bottom:20px;">
      <strong>Selected Product</strong>
      <p id="selectedProductDetails"></p>
    </div>

    <input type="hidden" id="itemSelect">

    <label for="quantityInput">Enter Quantity (<span id="productUnitLabel">unit</span>):</label>
    <input type="number" id="quantityInput" min="0" step="0.001" placeholder="Enter quantity"> 

    <label for="aprice">Purchase Price Per Unit:</label>
    <input type="number" id="aprice" min="0" step="0.01" value="1" placeholder="Price per unit">
    <label>Total Amount:</label>
    <div id="stockTotal" style="font-size:20px; font-weight:bold; margin-bottom:20px;">0.00</div>


    <label for="remarks">Enter Remarks(optional):</label> 
    <input type="text" id="aremarks" value="none" placeholder="remarks"> <br>


    <button id="addStockButton" onclick="addItemToStore()"> Add Item to Store</button>
    <div id="stockSuccessMessage" class="stock-success-toast" role="status" aria-live="polite"></div>
    <br><br>
    <button onclick="backToHomepage()"> Back To Home Page</button> 

  </div>
