<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f6fb" />
  <title>STOREOFGAMES - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef3fb 0%, #f8fafc 55%, #e9f0fa 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 34px 30px;
      background: #fff;
      border: 1px solid #e8edf5;
      border-radius: 18px;
      box-shadow: 0 14px 38px rgba(28, 48, 80, .10);
    }
    .brand {
      margin: 0;
      text-align: center;
      color: #172b4d;
      font-size: clamp(25px, 6vw, 30px);
      font-weight: 750;
      letter-spacing: .5px;
    }
    .subtitle {
      margin: 10px 0 28px;
      text-align: center;
      color: #68758a;
      font-size: 14px;
      line-height: 1.5;
    }
    .field { margin-bottom: 17px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: #344258;
      font-size: 13px;
      font-weight: 600;
    }
    input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cfd7e3;
      border-radius: 8px;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: #3478d4;
      box-shadow: 0 0 0 3px rgba(52, 120, 212, .13);
    }
    .login-button {
      width: 100%;
      min-height: 48px;
      margin-top: 7px;
      border: 0;
      border-radius: 8px;
      background: #2fa84f;
      color: #fff;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .login-button:hover { background: #258d41; }
    .login-button:active { transform: translateY(1px); }
    .login-button:disabled { opacity: .7; cursor: wait; }
    .register-link {
      margin: 22px 0 0;
      text-align: center;
      color: #59677d;
      font-size: 14px;
    }
    .register-link a {
      color: #245fa8;
      font-weight: 600;
      text-decoration: none;
    }
    .register-link a:hover { text-decoration: underline; }
    .error {
      min-height: 18px;
      margin-top: 13px;
      color: #c0392b;
      text-align: center;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    @media (max-width: 420px) {
      .login-card { padding: 32px 23px 25px; border-radius: 15px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1 class="brand">STOREOFGAMES</h1>
    <p class="subtitle">Sign in to manage your store</p>

    <form id="login-form">
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="Enter 10-digit phone number"
          autocomplete="username" inputmode="numeric" maxlength="13" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password"
          autocomplete="current-password" required />
      </div>
      <button class="login-button" type="submit">Login</button>
      <div class="error" id="error-msg" role="alert" aria-live="polite"></div>
    </form>

    <p class="register-link">First time here? <a href="register.html">Create your password</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const loginButton = loginForm.querySelector('button[type="submit"]');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMsg.style.color = '#c0392b';
      errorMsg.textContent = '';

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      loginButton.disabled = true;
      loginButton.textContent = 'Signing in...';

      try {
        await STORE_AUTH.signIn(phone, password);
        errorMsg.style.color = '#258d41';
        errorMsg.textContent = 'Login successful!';
        window.location.href = 'homepage.html';
      } catch (error) {
        console.error('Login failed:', error);
        errorMsg.textContent = error.message || 'Invalid phone number or password.';
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
